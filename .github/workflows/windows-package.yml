# Windows release zip built on a GitHub-hosted runner (SignPath code signing only accepts builds
# from GitHub-hosted runners for open-source projects). Same toolchain as scripts/package.ps1
# expects in tools/: llvm-mingw 20261006 (ucrt for Rust, msvcrt for HDF5) and cmake/ninja.
name: windows-package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Rust (x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
      - name: llvm-mingw 20261006
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          $pins = @{
            'ucrt'   = '317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a'
            'msvcrt' = '24847b37a951c8583c3f7ec061de2eb87f6394215c8ef3fdc4565ed0835396e1'
          }
          foreach ($v in $pins.Keys) {
            $zip = "tools/llvm-mingw-20261006-$v-x86_64.zip"
            Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-$v-x86_64.zip" -OutFile $zip
            if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() -ne $pins[$v]) { throw "checksum mismatch: $zip" }
            tar -xf $zip -C tools
            Remove-Item $zip
          }
      - name: cmake and ninja (HDF5 build)
        shell: pwsh
        run: |
          python -m venv tools/v73-python
          tools/v73-python/Scripts/python -m pip install --quiet 'cmake==4.4.4' 'ninja>=1.13,<1.14'
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/MatRust-*-windows-x64.zip*
          retention-days: 7
